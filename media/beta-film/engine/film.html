<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dorylinae: closed beta film</title>
<!--
  The whole film is one deterministic page. Nothing animates by itself: window.renderAt(t) sets every
  pixel as a pure function of t (seconds). ?format=16x9 (1920x1080) or ?format=4x5 (1080x1350).
  Shots live in shots/*.js and register with FILM.shot(); the order of <script> tags does not matter.
-->
<style>
  @font-face { font-family: "Special Elite"; src: url(fonts/SpecialElite-Regular.ttf) format("truetype"); font-weight: 400; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url(fonts/IBMPlexMono-Regular.woff) format("woff"); font-weight: 400; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url(fonts/IBMPlexMono-Medium.woff) format("woff"); font-weight: 500; font-display: block; }
  @font-face { font-family: "IBM Plex Sans"; src: url(fonts/IBMPlexSans-Regular.woff) format("woff"); font-weight: 400; font-display: block; }
  @font-face { font-family: "IBM Plex Sans"; src: url(fonts/IBMPlexSans-Medium.woff) format("woff"); font-weight: 500; font-display: block; }
  @font-face { font-family: "IBM Plex Sans"; src: url(fonts/IBMPlexSans-SemiBold.woff) format("woff"); font-weight: 600; font-display: block; }
  *, *::before, *::after { animation: none !important; transition: none !important; box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: #07060F; }
  body { -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-kerning: normal; font-feature-settings: "kern" 1; }
  #stage { position: relative; overflow: hidden; background: #07060F; }
  .shot { position: absolute; inset: 0; overflow: hidden; display: none; }
  .abs { position: absolute; }
  #debug { position: absolute; right: 8px; bottom: 6px; font: 500 14px/1 "IBM Plex Mono"; color: #8C85AB; z-index: 99; display: none; }
</style>
</head>
<body>
<div id="stage"><div id="debug"></div></div>
<script src="lib/core.js"></script>
<script src="lib/components.js"></script>
<script src="lib/kit.js"></script>
<script src="lib/boot.js"></script>
<script src="assets/assets.js"></script>
<script>
  // ---------- shot registry
  (() => {
    const F = window.FILM;
    F.shots = [];
    F.cues = [];                       // sound cues: { t, kind, ...}  (absolute seconds)
    /** def: { id, start, end, pre=0, post=0, z=0, enter: 'cut21'|undefined, build(root, api) -> render(tLocal, tAbs) }
        A shot with post > 0 holds its last frame for `post` seconds (under the next shot's 21° cut). */
    F.shot = (def) => F.shots.push({ pre: 0, post: 0, z: 0, ...def });
    F.cue = (t, kind, extra = {}) => F.cues.push({ t: +t.toFixed(4), kind, ...extra });
  })();
</script>
<script>
  // ?cut=v2 loads shots-v2/manifest.js (the v2 film); no cut = v1 (shots/manifest.js)
  document.write(`<script src="${(new URLSearchParams(location.search).get('cut') ? 'shots-' + new URLSearchParams(location.search).get('cut') : 'shots')}/manifest.js"><\/script>`);
</script>
<script>
  (async () => {
    const F = window.FILM;
    const stage = document.getElementById('stage');
    stage.style.width = F.FMT.W + 'px'; stage.style.height = F.FMT.H + 'px';
    document.body.style.width = F.FMT.W + 'px'; document.body.style.height = F.FMT.H + 'px';
    // load the shot scripts listed in the manifest, in order
    for (const src of F.manifest) await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('missing ' + src)); document.head.append(sc); });
    // fonts first: every face and weight the film uses, then a check that they all decoded
    const faces = ['400 40px "Special Elite"', '400 40px "IBM Plex Mono"', '500 40px "IBM Plex Mono"', '400 40px "IBM Plex Sans"', '500 40px "IBM Plex Sans"', '600 40px "IBM Plex Sans"'];
    await Promise.all(faces.map((f) => document.fonts.load(f, 'DORYLINAE agentnet 0123')));
    await document.fonts.ready;
    for (const f of faces) if (!document.fonts.check(f, 'A')) throw new Error('font not ready: ' + f);
    F.shots.sort((a, b) => a.start - b.start || a.z - b.z);
    for (const sh of F.shots) {
      sh.root = document.createElement('div');
      sh.root.className = 'shot'; sh.root.dataset.id = sh.id; sh.root.style.zIndex = String(10 + sh.z);
      stage.append(sh.root);
      sh.render = await sh.build(sh.root, { start: sh.start, end: sh.end });
    }
    await Promise.all([...document.images].map((im) => im.decode().catch(() => { throw new Error('image failed ' + im.src); })));
    // images inside SVG <image> elements
    window.DURATION = F.duration ?? Math.max(...F.shots.map((s) => s.end));
    window.CUES = { cues: F.cues.sort((a, b) => a.t - b.t), duration: window.DURATION, format: F.FMT.name, shots: F.shots.map((s) => ({ id: s.id, start: s.start, end: s.end })), blur: F.blurWindows };
    const dbg = document.getElementById('debug');
    if (F.params.get('debug')) dbg.style.display = 'block';
    window.renderAt = (t) => {
      for (const sh of F.shots) {
        const on = t >= sh.start - sh.pre && t < sh.end + sh.post;
        if (sh.__on !== on) { sh.root.style.display = on ? 'block' : 'none'; sh.__on = on; }
        if (on) {
          // after its end a shot holds its last frame (it sits under the next shot's 21° cut)
          const tl = Math.min(t - sh.start, sh.end - sh.start - 1e-4);
          sh.render(tl, Math.min(t, sh.end - 1e-4));
          if (sh.enter === 'cut21') F.cut21(sh.root, t - sh.start);
        }
      }
      if (F.params.get('debug')) dbg.textContent = `${t.toFixed(3)}s  bar ${Math.floor(t / 2.4) + 1}.${Math.floor((t % 2.4) / 0.6) + 1}`;
    };
    window.renderAt(0);
  })().then(() => { window.__resolveReady(); }, (e) => { window.__rejectReady(e); });
  window.ready = new Promise((res, rej) => { window.__resolveReady = res; window.__rejectReady = rej; });
</script>
</body>
</html>
