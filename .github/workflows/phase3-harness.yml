name: Phase 3 harness (weekly)

# Ticket 3.H: the same tests/harness/phase3-agents script as the manual
# real-agent debate run, but with the scripted stand-in agent
# (tests/harness/standin -mode debate), which needs no API key or logged-in
# harness. Runs both an agreed debate and a forced escalation (OD-P3-7/3.5);
# real Claude Code / agy rounds stay manual (tests/phase3-manual.md).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run the stand-in harness (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: tests/harness/phase3-agents.sh --harness standin
      - name: Run the stand-in harness (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -File tests/harness/phase3-agents.ps1 -Harness standin
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/phase3-agents-*
            /tmp/phase3-agents-*
          if-no-files-found: ignore
