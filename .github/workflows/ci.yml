name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # Windows runners put %TEMP% on the C: OS disk, where flushes are slow:
      # every SQLite commit of the tests' daemons fsyncs, so the store-heavy
      # packages ran 15-25x slower than on Linux (CPU-bound ones 1x) and IPC
      # calls hit their timeouts (INV-2). RUNNER_TEMP is on the D: work drive.
      # -timeout 20m: internal/daemon took 466-600 s on Windows, at the 10 min
      # default; the headroom keeps a slow but passing run from being killed.
      - name: Put test temp dirs on the work drive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: go test ./... -count=1 -timeout 20m

  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -race ./... -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2

  # 4.4d: a real install/start/stop/uninstall of the per-user service on the
  # two OSes that were never exercised by hand (systemd user unit on Linux,
  # launchd agent on macOS). See tests/phase4-manual.md for what even this
  # cannot cover (a real interactive login, a reboot, a locked keychain).
  unix-service:
    name: unix service install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build agentnet and agentnetd
        run: go build -trimpath -o bin/ ./cmd/agentnet ./cmd/agentnetd
      # ubuntu-latest has no login session, so systemd never starts a user
      # manager for the runner account; enable-linger starts one without a
      # login (the standard way to get a working `systemctl --user` in CI).
      - name: Enable a systemd user session (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(whoami)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: Wait for the systemd user manager to come up (Linux)
        if: runner.os == 'Linux'
        run: |
          for i in $(seq 1 20); do
            if systemctl --user daemon-reload 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::systemd --user manager never became ready"
          exit 1
      # The installed daemon must never touch a real keychain in CI: on Linux
      # there is no Secret Service to hang on (that path is what
      # internal/keystore's own tests cover), and on macOS an unattended
      # keychain write would leave state behind. set-environment/setenv reach
      # the units this job's `install` step is about to start.
      - name: Force the file keystore for the installed service
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            systemctl --user set-environment DORYLINAE_KEYSTORE=file
          else
            launchctl setenv DORYLINAE_KEYSTORE file
          fi
      - name: Install, start, check, stop, uninstall and confirm cleanup
        shell: bash
        run: |
          set -euo pipefail
          export DORYLINAE_HOME="$RUNNER_TEMP/agentnetd-home"

          ./bin/agentnetd install --home "$DORYLINAE_HOME"

          up=""
          for i in $(seq 1 40); do
            if ./bin/agentnet status >/dev/null 2>&1; then up=1; break; fi
            sleep 0.5
          done
          [ -n "$up" ] || { echo "::error::agentnetd did not come up as a service within 20s"; exit 1; }
          ./bin/agentnet status

          if [ "${{ runner.os }}" = "Linux" ]; then
            test -f "$HOME/.config/systemd/user/agentnetd.service"
            systemctl --user is-active agentnetd.service
          else
            test -f "$HOME/Library/LaunchAgents/dev.dorylinae.agentnetd.plist"
            launchctl print "gui/$(id -u)/dev.dorylinae.agentnetd" >/dev/null
          fi

          ./bin/agentnetd stop

          down=""
          for i in $(seq 1 40); do
            if ! ./bin/agentnet status >/dev/null 2>&1; then down=1; break; fi
            sleep 0.5
          done
          [ -n "$down" ] || { echo "::error::agentnetd was still reachable 20s after stop"; exit 1; }

          ./bin/agentnetd uninstall --home "$DORYLINAE_HOME"

          if [ "${{ runner.os }}" = "Linux" ]; then
            test ! -f "$HOME/.config/systemd/user/agentnetd.service"
            if systemctl --user list-unit-files 2>/dev/null | grep -q '^agentnetd\.service'; then
              echo "::error::agentnetd.service is still known to systemd --user after uninstall"
              exit 1
            fi
          else
            test ! -f "$HOME/Library/LaunchAgents/dev.dorylinae.agentnetd.plist"
            if launchctl print "gui/$(id -u)/dev.dorylinae.agentnetd" >/dev/null 2>&1; then
              echo "::error::the launchd job is still loaded after uninstall"
              exit 1
            fi
          fi

  # 4.4a: install.sh in a clean Ubuntu container, as a non-root user, against
  # a local file server, with fake release files signed by a throwaway test
  # key (good sums pass; flipped bytes, a wrong key and old versions fail;
  # sudo is never invoked). release.yml runs the same test on real artefacts.
  install-sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: shellcheck scripts/install.sh tests/install/run.sh tests/install/cases.sh packaging/homebrew/render.sh
      - run: sh tests/install/run.sh

  build:
    needs: [test, race, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, goos: linux, ext: ""}
          - {os: macos-latest, goos: darwin, ext: ""}
          - {os: windows-latest, goos: windows, ext: ".exe"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build all three binaries
        shell: bash
        run: make build
      - name: Smoke test --version
        shell: bash
        run: |
          for b in agentnet agentnetd relay; do
            ./bin/$b${{ matrix.ext }} --version
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.goos }}
          path: bin/

  cross:
    needs: [test, race, lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath ./cmd/...