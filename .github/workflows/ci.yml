name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # Windows runners put %TEMP% on the C: OS disk, where flushes are slow:
      # every SQLite commit of the tests' daemons fsyncs, so the store-heavy
      # packages ran 15-25x slower than on Linux (CPU-bound ones 1x) and IPC
      # calls hit their timeouts (INV-2). RUNNER_TEMP is on the D: work drive.
      # -timeout 20m: internal/daemon took 466-600 s on Windows, at the 10 min
      # default; the headroom keeps a slow but passing run from being killed.
      - name: Put test temp dirs on the work drive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: go test ./... -count=1 -timeout 20m

  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./... -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
  build:
    needs: [test, race, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, goos: linux, ext: ""}
          - {os: macos-latest, goos: darwin, ext: ""}
          - {os: windows-latest, goos: windows, ext: ".exe"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build all three binaries
        shell: bash
        run: make build
      - name: Smoke test --version
        shell: bash
        run: |
          for b in agentnet agentnetd relay; do
            ./bin/$b${{ matrix.ext }} --version
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}
          path: bin/

  cross:
    needs: [test, race, lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath ./cmd/...