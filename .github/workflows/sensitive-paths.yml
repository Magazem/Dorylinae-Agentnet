name: Sensitive paths

# Non-blocking: flags PRs that touch security-sensitive areas so reviewers
# give them extra attention. Never fails the build.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  flag-sensitive-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Check changed files against the sensitive-path list
        uses: actions/github-script@v9
        with:
          script: |
            // Keep this list in sync with what actually needs extra review
            // attention (grants, relay auth, accounts, installer/release).
            const SENSITIVE_PATTERNS = [
              /^internal\/capability\//,
              /^Docs\/protocol\/grant\.md$/,
              /^internal\/relay\/auth/,
              /^internal\/envelope\//,
              /^internal\/relayclient\//,
              /^internal\/relay\/accounts/,
              /^Docs\/protocol\/accounts\.md$/,
              /^scripts\/install\.sh$/,
              /^\.github\/workflows\/release\.yml$/,
              /^tools\/releasesign\//,
            ];

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 }
            );

            const touched = files
              .map((f) => f.filename)
              .filter((path) => SENSITIVE_PATTERNS.some((re) => re.test(path)));

            const marker = "<!-- sensitive-paths-check -->";

            if (touched.length === 0) {
              return;
            }

            const body = [
              marker,
              "This PR touches a security-sensitive path; consider an extra careful review before merging.",
              "",
              "Matched paths:",
              ...touched.map((p) => `- \`${p}\``),
            ].join("\n");

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pull_number, per_page: 100 }
            );
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body,
              });
            }
